services:
  - type: web
    name: frecuencia-pa4
    runtime: node
    plan: free
    buildCommand: FRECUENCIA_HOSTED=1 bash scripts/install.sh
    startCommand: node scripts/hosted.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.3
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
